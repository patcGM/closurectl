name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PIP_CONSTRAINT: requirements/release-constraints.txt

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.13"
          - os: ubuntu-latest
            python: "3.14"
          - os: windows-latest
            python: "3.13"

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install package
        run: python -m pip install ".[dev]"

      - name: Compile package
        run: python -m compileall -q src

      - name: Run tests
        run: |
          python -m coverage run -m unittest discover -s tests -v
          python -m coverage report

      - name: Run offline demo
        run: closurectl demo --dir ci-demo

      - name: Verify demo receipt
        run: >-
          closurectl verify ci-demo/closure-receipt.json
          --public-key ci-demo/demo-public.pem
          --graph ci-demo/authority-graph.json
          --plan ci-demo/closure-plan.json

  package:
    name: Build source distribution
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install quality and build tools
        run: python -m pip install build ruff twine

      - name: Check formatting and imports
        run: |
          ruff check .
          ruff format --check .

      - name: Build package
        run: python -m build

      - name: Check package metadata
        run: python -m twine check dist/*

      - name: Smoke-test wheel in a clean environment
        run: |
          python -m venv .wheel-venv
          .wheel-venv/bin/python -m pip install dist/*.whl
          .wheel-venv/bin/closurectl --version
          .wheel-venv/bin/closurectl demo --dir wheel-demo

      - name: Smoke-test source archive in a clean environment
        run: |
          python -m venv .sdist-venv
          .sdist-venv/bin/python -m pip install dist/*.tar.gz
          .sdist-venv/bin/closurectl --version
          .sdist-venv/bin/closurectl demo --dir sdist-demo
          .sdist-venv/bin/closurectl verify sdist-demo/closure-receipt.json \
            --public-key sdist-demo/demo-public.pem \
            --graph sdist-demo/authority-graph.json \
            --plan sdist-demo/closure-plan.json

      - name: Check generated artifacts for leaked test credentials
        shell: python
        run: |
          from pathlib import Path

          forbidden = ("do-not-persist", "plaintext-should-never-appear", "npm_partial_key")
          for root in (Path("wheel-demo"), Path("sdist-demo")):
              for path in root.rglob("*.json"):
                  content = path.read_text(encoding="utf-8")
                  assert not any(value in content for value in forbidden), path
