name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  PIP_CONSTRAINT: requirements/release-constraints.txt

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    name: Validate release source
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Verify tag, version, and main ancestry
        env:
          GH_API_TOKEN: ${{ github.token }}
          LIVE_DRILL_SHA: ${{ vars.LIVE_DRILL_SHA }}
        run: |
          VERSION="$(PYTHONPATH=src python -c 'from closurectl import __version__; print(__version__)')"
          test "v${VERSION}" = "${GITHUB_REF_NAME}"
          TAG_REF="$(curl --fail --silent --show-error \
            --header "Authorization: Bearer ${GH_API_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/ref/tags/${GITHUB_REF_NAME}")"
          test "$(printf '%s' "${TAG_REF}" | jq -r '.object.type')" = "tag"
          TAG_URL="$(printf '%s' "${TAG_REF}" | jq -r '.object.url')"
          TAG_OBJECT="$(curl --fail --silent --show-error \
            --header "Authorization: Bearer ${GH_API_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            "${TAG_URL}")"
          test "$(printf '%s' "${TAG_OBJECT}" | jq -r '.tag')" = "${GITHUB_REF_NAME}"
          test "$(printf '%s' "${TAG_OBJECT}" | jq -r '.verification.verified')" = "true"
          test "$(printf '%s' "${TAG_OBJECT}" | jq -r '.tagger.name')" = "patcGM"
          test "$(printf '%s' "${TAG_OBJECT}" | jq -r '.tagger.email')" = "patcGM@users.noreply.github.com"
          test "$(printf '%s' "${TAG_OBJECT}" | jq -r '.object.sha')" = "${GITHUB_SHA}"
          git fetch origin main
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main
          test "${LIVE_DRILL_SHA}" = "${GITHUB_SHA}"

      - name: Install release tools
        run: python -m pip install ".[dev]" twine cyclonedx-bom

      - name: Run quality gate
        run: |
          ruff check .
          ruff format --check .
          python -m coverage run -m unittest discover -s tests -v
          python -m coverage report
          closurectl demo --dir release-gate-demo

      - name: Build Python distributions
        run: |
          python -m build
          python -m twine check dist/*
          python -m pip freeze --all > dist/closurectl-build-environment.lock
          cyclonedx-py environment \
            --output-format JSON \
            --output-file dist/closurectl-build-toolchain.cdx.json

      - name: Smoke-test Python distributions
        run: |
          python -m venv .wheel-venv
          .wheel-venv/bin/python -m pip install dist/*.whl
          .wheel-venv/bin/closurectl demo --dir wheel-release-demo
          python -m venv .sdist-venv
          .sdist-venv/bin/python -m pip install dist/*.tar.gz
          .sdist-venv/bin/closurectl demo --dir sdist-release-demo

      - name: Upload Python distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/*.cdx.json
            dist/*.lock
          if-no-files-found: error

  binary:
    name: Build ${{ matrix.name }}
    needs: gate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: closurectl-linux-x86_64
            output: ./dist/closurectl-linux-x86_64
          - os: windows-latest
            name: closurectl-windows-x86_64
            output: ./dist/closurectl-windows-x86_64.exe

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Install build dependencies
        run: python -m pip install . pyinstaller

      - name: Build single-file executable
        run: >-
          python -m PyInstaller
          --clean
          --onefile
          --name ${{ matrix.name }}
          --specpath build
          --workpath build/pyinstaller
          --distpath dist
          packaging/entrypoint.py

      - name: Smoke-test executable
        shell: pwsh
        run: |
          & '${{ matrix.output }}' --version
          & '${{ matrix.output }}' demo --dir frozen-demo
          & '${{ matrix.output }}' verify frozen-demo/closure-receipt.json `
            --public-key frozen-demo/demo-public.pem `
            --graph frozen-demo/authority-graph.json `
            --plan frozen-demo/closure-plan.json

      - name: Upload binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.output }}
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: [gate, binary]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      attestations: write
      contents: write
      id-token: write
    environment: release

    steps:
      - name: Download binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: closurectl-*
          path: release
          merge-multiple: true

      - name: Download Python distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-distributions
          path: release

      - name: Create checksums
        run: |
          cd release
          sha256sum * > SHA256SUMS.txt

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: release/*

      - name: Publish release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          prerelease: true
          files: release/*
