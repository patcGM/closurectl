name: Release

on:
  push:
    tags: ["v*"]

permissions:
  actions: read
  contents: read
  pull-requests: read

env:
  PIP_CONSTRAINT: requirements/release-constraints.txt

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    name: Validate release source
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Verify tag, version, ancestry, and provider drills
        env:
          GH_API_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(PYTHONPATH=src python -c 'from closurectl import __version__; print(__version__)')"
          test "v${VERSION}" = "${GITHUB_REF_NAME}"
          test -f ".github/releases/${GITHUB_REF_NAME}.md"
          if [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            test "${VERSION%%.*}" -ge 1
            grep -Fq '"Development Status :: 5 - Production/Stable"' pyproject.toml
          fi
          TAG_REF="$(curl --fail --silent --show-error \
            --header "Authorization: Bearer ${GH_API_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/ref/tags/${GITHUB_REF_NAME}")"
          test "$(printf '%s' "${TAG_REF}" | jq -r '.object.type')" = "tag"
          TAG_URL="$(printf '%s' "${TAG_REF}" | jq -r '.object.url')"
          TAG_OBJECT="$(curl --fail --silent --show-error \
            --header "Authorization: Bearer ${GH_API_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            "${TAG_URL}")"
          test "$(printf '%s' "${TAG_OBJECT}" | jq -r '.tag')" = "${GITHUB_REF_NAME}"
          test "$(printf '%s' "${TAG_OBJECT}" | jq -r '.verification.verified')" = "true"
          test "$(printf '%s' "${TAG_OBJECT}" | jq -r '.tagger.name')" = "patcGM"
          test "$(printf '%s' "${TAG_OBJECT}" | jq -r '.tagger.email')" = "patcGM@users.noreply.github.com"
          test "$(printf '%s' "${TAG_OBJECT}" | jq -r '.object.sha')" = "${GITHUB_SHA}"
          git fetch origin main
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main

          CI_RUNS="$(curl --fail --silent --show-error \
            --header "Authorization: Bearer ${GH_API_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?branch=main&event=push&per_page=100")"
          test "$(printf '%s' "${CI_RUNS}" | jq --arg sha "${GITHUB_SHA}" \
            '[.workflow_runs[] | select(
              .head_sha == $sha
              and .head_branch == "main"
              and .event == "push"
              and .status == "completed"
              and .conclusion == "success"
            )] | length')" -ge 1

          ASSOCIATED_PULLS="$(curl --fail --silent --show-error \
            --header "Authorization: Bearer ${GH_API_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls")"
          PR_NUMBER="$(printf '%s' "${ASSOCIATED_PULLS}" | jq -r --arg sha "${GITHUB_SHA}" \
            '[.[] | select(
              .merged_at != null
              and .base.ref == "main"
              and .merge_commit_sha == $sha
            )][0].number // empty')"
          test -n "${PR_NUMBER}"
          PR_HEAD="$(printf '%s' "${ASSOCIATED_PULLS}" | jq -r \
            --argjson number "${PR_NUMBER}" \
            '[.[] | select(.number == $number)][0].head.sha // empty')"
          test -n "${PR_HEAD}"
          REVIEWS="$(curl --fail --silent --show-error \
            --header "Authorization: Bearer ${GH_API_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/reviews?per_page=100")"
          test "$(printf '%s' "${REVIEWS}" | jq -r --arg head "${PR_HEAD}" \
            '[.[] | select(
              (.user.login | ascii_downcase) == "test2gm"
              and .commit_id == $head
            )] | sort_by(.submitted_at) | last | .state // empty')" = "APPROVED"

          LAB_RUNS="$(curl --fail --silent --show-error \
            --header "Authorization: Bearer ${GH_API_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/provider-lab.yml/runs?branch=main&event=workflow_dispatch&status=success&head_sha=${GITHUB_SHA}&per_page=1")"
          test "$(printf '%s' "${LAB_RUNS}" | jq --arg sha "${GITHUB_SHA}" \
            '[.workflow_runs[] | select(
              .head_sha == $sha
              and .head_branch == "main"
              and .event == "workflow_dispatch"
              and .conclusion == "success"
            )] | length')" -ge 1

      - name: Install release tools
        run: python -m pip install ".[dev]" bandit pip-audit twine cyclonedx-bom

      - name: Run quality gate
        run: |
          ruff check .
          ruff format --check .
          bandit -q -r src
          python -m pip_audit --strict -r requirements/release-constraints.txt
          python -m coverage run -m unittest discover -s tests -v
          python -m coverage report
          closurectl demo --dir release-gate-demo

      - name: Build Python distributions
        run: |
          python -m build
          python -m twine check dist/*
          python -m pip freeze --all > dist/closurectl-build-environment.lock
          cyclonedx-py environment \
            --output-format JSON \
            --output-file dist/closurectl-build-toolchain.cdx.json

      - name: Smoke-test Python distributions
        run: |
          python -m venv .wheel-venv
          .wheel-venv/bin/python -m pip install dist/*.whl
          .wheel-venv/bin/closurectl demo --dir wheel-release-demo
          python -m venv .sdist-venv
          .sdist-venv/bin/python -m pip install dist/*.tar.gz
          .sdist-venv/bin/closurectl demo --dir sdist-release-demo

      - name: Upload Python distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/*.cdx.json
            dist/*.lock
          if-no-files-found: error

  binary:
    name: Build ${{ matrix.name }}
    needs: gate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: closurectl-linux-x86_64
            output: ./dist/closurectl-linux-x86_64
          - os: ubuntu-24.04-arm
            name: closurectl-linux-arm64
            output: ./dist/closurectl-linux-arm64
          - os: windows-2025
            name: closurectl-windows-x86_64
            output: ./dist/closurectl-windows-x86_64.exe
          - os: macos-15-intel
            name: closurectl-macos-x86_64
            output: ./dist/closurectl-macos-x86_64
          - os: macos-15
            name: closurectl-macos-arm64
            output: ./dist/closurectl-macos-arm64

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Install build dependencies
        run: python -m pip install . pyinstaller

      - name: Build single-file executable
        run: >-
          python -m PyInstaller
          --clean
          --onefile
          --name ${{ matrix.name }}
          --specpath build
          --workpath build/pyinstaller
          --distpath dist
          packaging/entrypoint.py

      - name: Smoke-test executable on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & '${{ matrix.output }}' --version
          & '${{ matrix.output }}' demo --dir frozen-demo
          & '${{ matrix.output }}' verify frozen-demo/closure-receipt.json `
            --public-key frozen-demo/demo-public.pem `
            --graph frozen-demo/authority-graph.json `
            --plan frozen-demo/closure-plan.json

      - name: Smoke-test executable on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          chmod +x '${{ matrix.output }}'
          '${{ matrix.output }}' --version
          '${{ matrix.output }}' demo --dir frozen-demo
          '${{ matrix.output }}' verify frozen-demo/closure-receipt.json \
            --public-key frozen-demo/demo-public.pem \
            --graph frozen-demo/authority-graph.json \
            --plan frozen-demo/closure-plan.json

      - name: Upload binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.output }}
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: [gate, binary]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      attestations: write
      contents: write
      id-token: write
    environment: release

    steps:
      - name: Check out release notes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: closurectl-*
          path: release
          merge-multiple: true

      - name: Download Python distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-distributions
          path: release

      - name: Create checksums
        run: |
          cd release
          sha256sum ./* > SHA256SUMS.txt

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: release/*

      - name: Determine release channel
        id: channel
        run: |
          if [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            if [ "${VERSION%%.*}" -ge 1 ]; then
              echo "prerelease=false" >> "${GITHUB_OUTPUT}"
            else
              echo "prerelease=true" >> "${GITHUB_OUTPUT}"
            fi
          else
            echo "prerelease=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Publish release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          body_path: .github/releases/${{ github.ref_name }}.md
          prerelease: ${{ steps.channel.outputs.prerelease }}
          files: release/*
